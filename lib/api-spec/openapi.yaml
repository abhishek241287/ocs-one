components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StageParam:
      name: stage
      in: path
      required: true
      schema:
        type: string
        enum: [cell_allocation, assembly, compression, bms_allocation, bms_programming, charging, testing, quality_control, packing]
    SearchParam:
      name: search
      in: query
      required: false
      schema:
        type: string
    StatusParam:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [active, inactive]
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        default: 25

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MasterStatus:
      type: string
      enum: [active, inactive]

    MasterStatusToggle:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/MasterStatus"

    Attachment:
      type: object
      required: [id, name, url, fileType, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string }
        fileType: { type: string }
        uploadedAt: { type: string, format: date-time }

    MasterCommon:
      type: object
      required: [id, code, name, status, revision_number, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/MasterStatus" }
        revision_number: { type: integer }
        effective_date: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
        created_by: { type: ["string", "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_by: { type: ["string", "null"], format: uuid }
        updated_at: { type: string, format: date-time }

    MasterCommonInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        effective_date: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }

    MasterCommonUpdate:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        effective_date: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }


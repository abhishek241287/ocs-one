openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: masters
    description: Engineering Master Data operations
  - name: manufacturing
    description: Manufacturing Execution System operations
  - name: dashboard
    description: Director dashboard operations
  - name: products
    description: Serialized Product (unit) operations — Unified Product Platform
  - name: inventory
    description: Inventory Platform operations — GRN receiving, workflow routing, stock ledger
  - name: procurement
    description: Procurement operations — purchase orders, approvals, and receipt tracking
  - name: bom
    description: MES — Bill of Materials (BOM Master) operations
  - name: material-issues
    description: MES — Material Issue Note (BOM-driven raw-material consumption)
  - name: customers
    description: Customer registration operations (product ownership)
  - name: warranties
    description: Warranty operations (common engine across all product types)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"


  # ── Logistics — Dealers ───────────────────────────────────────────────────────
  /logistics/dealers:
    get:
      operationId: listDealers
      tags: [logistics]
      summary: List all dealers
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Dealers list
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Dealer" }
                  total: { type: integer }
    post:
      operationId: createDealer
      tags: [logistics]
      summary: Create a new dealer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DealerInput" }
      responses:
        "201":
          description: Dealer created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dealer" }

  /logistics/dealers/{id}:
    get:
      operationId: getDealer
      tags: [logistics]
      summary: Get a dealer
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Dealer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dealer" }
    put:
      operationId: updateDealer
      tags: [logistics]
      summary: Update a dealer
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DealerInput" }
      responses:
        "200":
          description: Updated dealer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dealer" }
    delete:
      operationId: deleteDealer
      tags: [logistics]
      summary: Delete a dealer
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted

  # ── Logistics — Dispatch Orders ───────────────────────────────────────────────
  /logistics/dispatch-orders:
    get:
      operationId: listDispatchOrders
      tags: [logistics]
      summary: List dispatch orders
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, confirmed, loaded, in_transit, delivered, cancelled] }
        - name: dealerId
          in: query
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Dispatch orders list
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DispatchOrder" }
                  total: { type: integer }
    post:
      operationId: createDispatchOrder
      tags: [logistics]
      summary: Create a dispatch order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DispatchOrderInput" }
      responses:
        "201":
          description: Dispatch order created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispatchOrder" }

  /logistics/dispatch-orders/{id}:
    get:
      operationId: getDispatchOrder
      tags: [logistics]
      summary: Get a dispatch order with batteries
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Dispatch order detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispatchOrderDetail" }
    put:
      operationId: updateDispatchOrder
      tags: [logistics]
      summary: Update a dispatch order
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DispatchOrderInput" }
      responses:
        "200":
          description: Updated dispatch order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispatchOrder" }

  /logistics/dispatch-orders/{id}/items:
    post:
      operationId: addDispatchItem
      tags: [logistics]
      summary: Add a battery to a dispatch order
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productionOrderId]
              properties:
                productionOrderId: { type: string, format: uuid }
      responses:
        "201":
          description: Item added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispatchItem" }

  /logistics/dispatch-orders/{id}/items/{itemId}:
    delete:
      operationId: removeDispatchItem
      tags: [logistics]
      summary: Remove a battery from a dispatch order
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Removed

  /logistics/dispatch-orders/{id}/status:
    post:
      operationId: advanceDispatchStatus
      tags: [logistics]
      summary: Advance dispatch order status
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, actor]
              properties:
                status: { type: string, enum: [confirmed, loaded, in_transit, delivered, cancelled] }
                actor: { type: string }
                notes: { type: string }
      responses:
        "200":
          description: Updated dispatch order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispatchOrder" }

  # ── Logistics — Packing Dashboard ─────────────────────────────────────────────
  /logistics/packing-dashboard:
    get:
      operationId: getPackingDashboard
      tags: [logistics]
      summary: Live packing & dispatch KPI dashboard
      responses:
        "200":
          description: Packing dashboard stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackingDashboard" }

  # ─── Auth ─────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Login successful — sets httpOnly cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401":
          description: Invalid credentials

  /auth/register:
    post:
      operationId: authRegister
      tags: [auth]
      summary: Register a new account (defaults to viewer role)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Account created — sets httpOnly cookie and auto-logs in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400":
          description: Validation error
        "409":
          description: Email already registered

  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Log out and clear session cookie
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Authenticated user info
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/AuthUser" }
        "401":
          description: Not authenticated

  /auth/password:
    patch:
      operationId: changeAuthPassword
      tags: [auth]
      summary: Change the authenticated user's password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChangeRequest" }
      responses:
        "200":
          description: Password changed and existing sessions revoked
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
        "400":
          description: Validation error
        "401":
          description: Current password is incorrect or session is invalid

  /auth/users:
    get:
      operationId: listAuthUsers
      tags: [auth]
      summary: List user accounts for access management
      responses:
        "200":
          description: User accounts without password or session data
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UserAccount" }
                  total: { type: integer }
        "403":
          description: Director or owner access required

  /auth/users/{id}:
    patch:
      operationId: updateAuthUser
      tags: [auth]
      summary: Update a user's role, active status, or password
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserUpdate" }
      responses:
        "200":
          description: Updated user account; existing sessions are revoked when security-sensitive fields change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAccount" }
        "400":
          description: Validation error
        "403":
          description: Director or owner access required
        "404":
          description: User not found

  /auth/users/{id}/dealer:
    patch:
      operationId: updateAuthUserDealer
      tags: [auth]
      summary: Assign a dealer account to a dealer-role user
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserDealerAssignment" }
      responses:
        "200":
          description: Updated user account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAccount" }
        "400":
          description: User is not a dealer role or dealer is inactive
        "403":
          description: Director or owner access required
        "404":
          description: User or dealer not found

  # ─── Director Dashboard ───────────────────────────────────────────────────
  /dashboard/director:
    get:
      operationId: getDirectorDashboard
      tags: [dashboard]
      summary: Live director dashboard — all KPIs and pipeline in one call
      responses:
        "200":
          description: Director dashboard data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectorDashboard" }
        "401":
          description: Not authenticated

  # ─── Unified Product Platform — serialized Products ──────────────────────────
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List serialized products (units)
      parameters:
        - $ref: "#/components/parameters/SearchParam"
        - name: product_status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProductStatus"
        - name: category_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: model_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: dealer_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: current_location
          in: query
          required: false
          schema: { type: string }
        - name: manufactured_from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: manufactured_to
          in: query
          required: false
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductListResponse" }

  /products/inventory-summary:
    get:
      operationId: getProductInventorySummary
      tags: [products]
      summary: Read-only Product Inventory summary (aggregate projection over the Product Platform)
      responses:
        "200":
          description: Aggregate inventory counts projected from product status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductInventorySummary" }

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a single product
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Single product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404":
          description: Product not found

  /products/{id}/genealogy:
    get:
      operationId: getProductGenealogy
      tags: [products]
      summary: Get a product's component lineage
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Product genealogy records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductGenealogyResponse" }
        "404":
          description: Product not found

  /products/{id}/events:
    get:
      operationId: getProductEvents
      tags: [products]
      summary: Get a product's lifecycle event timeline
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Product event timeline (newest first)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductEventsResponse" }
        "404":
          description: Product not found

  /products/{id}/traceability:
    get:
      operationId: getProductTraceability
      tags: [products]
      summary: Get a product's full 360° lifecycle traceability (read-only aggregation)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Complete cradle-to-grave lineage for the serialized product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductTraceability" }
        "404":
          description: Product not found

  /products/{id}/status:
    post:
      operationId: updateProductStatus
      tags: [products]
      summary: Transition a product's lifecycle status (guarded)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductStatusUpdate" }
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400":
          description: Invalid status transition
        "404":
          description: Product not found

  # ─── Imported Product Registration (G1) ──────────────────────────────────────
  /products/imported:
    post:
      operationId: createImportedProduct
      tags: [products]
      summary: Register inspected imported inventory as serialized Product(s) — no order, no BOM
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportedProductInput" }
      responses:
        "201":
          description: Imported product(s) registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportedProductResult" }
        "400":
          description: Invalid request body
        "404":
          description: Model or source GRN not found
        "409":
          description: Duplicate OEM serial
        "422":
          description: Model category not importable, or missing OEM serials / quantity

  # ─── Packing module (Product-Platform-driven fulfillment) ────────────────────
  /packing:
    post:
      operationId: packProducts
      tags: [packing]
      summary: Pack ready-for-packing products (batch, atomic)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackProductsInput" }
      responses:
        "200":
          description: Products packed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackProductsResult" }
        "400":
          description: Invalid request body
        "422":
          description: One or more products are not in ready_for_packing

  # ─── Dispatch module (Product-Platform-driven fulfillment) ───────────────────
  /dispatch:
    get:
      operationId: listDispatches
      tags: [dispatch]
      summary: List dispatch documents (search + pagination)
      parameters:
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, default: 50 } }
      responses:
        "200":
          description: Dispatch documents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispatchListResponse" }
    post:
      operationId: dispatchProducts
      tags: [dispatch]
      summary: Dispatch packed products to a dealer (batch, atomic)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DispatchProductsInput" }
      responses:
        "200":
          description: Products dispatched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispatchProductsResult" }
        "400":
          description: Invalid request body
        "404":
          description: Dealer not found
        "409":
          description: Invoice number already used
        "422":
          description: Dealer inactive, or one or more products are not in packed

  /dispatch/{id}:
    get:
      operationId: getDispatch
      tags: [dispatch]
      summary: Get a dispatch document (powers the printable Dispatch Note)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Dispatch document detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispatchDetail" }
        "404":
          description: Dispatch not found

  /dispatch/{id}/reverse:
    post:
      operationId: reverseDispatch
      tags: [dispatch]
      summary: Reverse a dispatch (append-only; restores products to packed)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReverseDispatchInput" }
      responses:
        "200":
          description: Dispatch reversed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispatchDetail" }
        "400":
          description: Invalid request body
        "404":
          description: Dispatch not found
        "409":
          description: Dispatch already reversed
        "422":
          description: One or more products can no longer be reversed

  # ─── Dealer module (read-only projection over the Product Platform) ──────────
  /dealers/{id}/inventory:
    get:
      operationId: dealerInventory
      tags: [dealers]
      summary: Products currently assigned to a dealer (read-only projection)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Dealer inventory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealerInventoryResponse" }
        "404":
          description: Dealer not found

  /dealers/{id}/dispatch-history:
    get:
      operationId: dealerDispatchHistory
      tags: [dealers]
      summary: Dispatch events for a dealer's products (read-only projection)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Dealer dispatch history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealerDispatchHistoryResponse" }
        "404":
          description: Dealer not found

  # ─── Material Issue Note (MIN) — BOM-driven raw-material consumption ──────────
  /manufacturing/orders/{id}/material-issues/preview:
    get:
      operationId: previewMaterialIssue
      tags: [material-issues]
      summary: Preview the BOM-driven material requirements for an order (availability + FIFO lot suggestions)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Computed material requirements
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MinPreview" }
        "404":
          description: Production order not found

  /manufacturing/orders/{id}/material-issues:
    get:
      operationId: listMaterialIssues
      tags: [material-issues]
      summary: List Material Issue Notes for a production order
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Material Issue Notes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MinListResponse" }
        "404":
          description: Production order not found
    post:
      operationId: issueMaterials
      tags: [material-issues]
      summary: Issue BOM-driven materials against a production order (atomic, immutable MIN)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueMaterialsInput" }
      responses:
        "201":
          description: Materials issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MinDetail" }
        "400":
          description: Invalid request body
        "404":
          description: Production order not found, or no approved BOM
        "409":
          description: Materials already issued for this order (active MIN exists)
        "422":
          description: Insufficient stock, or missing mandatory traceability reference

  /manufacturing/orders/{id}/material-issues/{minId}:
    get:
      operationId: getMaterialIssue
      tags: [material-issues]
      summary: Get a Material Issue Note (header + lines + reversal)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: minId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Material Issue Note detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MinDetail" }
        "404":
          description: Material Issue Note not found

  /manufacturing/orders/{id}/material-issues/{minId}/reverse:
    post:
      operationId: reverseMaterialIssue
      tags: [material-issues]
      summary: Reverse a Material Issue Note (append-only; restores stock)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: minId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReverseMinInput" }
      responses:
        "200":
          description: Material Issue Note reversed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MinDetail" }
        "400":
          description: Invalid request body
        "404":
          description: Material Issue Note not found
        "409":
          description: Material Issue Note already reversed

  # ─── Customer Registration (G3) ──────────────────────────────────────────────
  /customers/registrations:
    get:
      operationId: listCustomerRegistrations
      tags: [customers]
      summary: List customer registrations (search + pagination)
      parameters:
        - $ref: "#/components/parameters/SearchParam"
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, default: 50 } }
      responses:
        "200":
          description: Customer registrations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerRegistrationListResponse" }
    post:
      operationId: createCustomerRegistration
      tags: [customers]
      summary: Register an end customer for a dispatched product (auto-creates warranty)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerRegistrationInput" }
      responses:
        "201":
          description: Registration created (with warranty)
          content:

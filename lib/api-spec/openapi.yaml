                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/IncomingInspection"
    post:
      operationId: createInspection
      tags: [inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncomingInspectionInput" }
      responses:
        "201":
          description: Inspection recorded; inventory moved (pending → accepted + rejected)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncomingInspectionDetail" }

  /inventory/inspections/eligible:
    get:
      operationId: listEligibleGrns
      tags: [inventory]
      responses:
        "200":
          description: Posted GRNs with inspection-pending lines and no inspection yet
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/EligibleGrn"

  /inventory/inspections/{id}:
    get:
      operationId: getInspection
      tags: [inventory]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Single inspection with lines
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncomingInspectionDetail" }

  /inventory/stock:
    get:
      operationId: listStockBalances
      tags: [inventory]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: search
          in: query
          required: false
          description: Filter by material code or name (case-insensitive substring)
          schema: { type: string }
        - name: stock_state
          in: query
          required: false
          description: Filter to a single stock state
          schema: { type: string, enum: [inspection_pending, available, rejected] }
        - name: master_type
          in: query
          required: false
          description: Filter to materials linked to this component-master family
          schema: { $ref: "#/components/schemas/LinkedMasterType" }
        - name: usage_type
          in: query
          required: false
          description: Filter to a single material usage type
          schema: { $ref: "#/components/schemas/MaterialUsageType" }
      responses:
        "200":
          description: On-hand stock projected from the inventory ledger, by material + state
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/StockBalance"
                  meta:
                    $ref: "#/components/schemas/MasterListMeta"

  /inventory/stock/{materialId}/provenance:
    get:
      operationId: getMaterialProvenance
      tags: [inventory]
      summary: Read-only per-material provenance — every contributing GRN receipt, derived from the signed ledger + existing GRN/Inspection records (no denormalization, no new tables)
      parameters:
        - name: materialId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Material provenance — contributing GRN receipts with supplier, inspection, and ledger-derived remaining available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialProvenance" }
        "404":
          description: Material not found

  /inventory/cell-stock:
    get:
      operationId: listCellStock
      tags: [inventory]
      summary: Available cell-category stock, netted per GRN line, eligible for transfer into Cell Processing
      parameters:
        - $ref: "#/components/parameters/SearchParam"
      responses:
        "200":
          description: Per-GRN-line available cell stock eligible for transfer
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CellStockLine"

  /inventory/transfers:
    get:
      operationId: listMaterialTransfers
      tags: [inventory]
      parameters:
        - $ref: "#/components/parameters/SearchParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: List of material transfer documents
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MaterialTransfer"
                  meta:
                    $ref: "#/components/schemas/MasterListMeta"
    post:
      operationId: createMaterialTransfer
      tags: [inventory]
      summary: Transfer available cell stock from a GRN line into Cell Processing (creates the cell lot + cells, decrements stock)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaterialTransferInput" }
      responses:
        "201":
          description: Transfer document created; cell lot + cells generated; stock decremented
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialTransferDetail" }
        "404":
          description: GRN line not found
        "409":
          description: Conflict
        "422":
          description: Insufficient available stock, or material has no cell-master mapping

  /inventory/transfers/{id}:
    get:
      operationId: getMaterialTransfer
      tags: [inventory]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Single transfer document with the created cell lot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialTransferDetail" }
        "404":
          description: Not found

  # ─── MES — Bill of Materials (BOM Master) ───────────────────────────────────
  /boms:
    get:
      operationId: listBoms
      tags: [bom]
      summary: List BOMs (search + pagination + filters)
      parameters:
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: model_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/BomStatus" } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, default: 50 } }
      responses:
        "200":
          description: BOMs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BomListResponse" }
    post:
      operationId: createBom
      tags: [bom]
      summary: Create a draft BOM (auto-assigns the next revision for the model)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BomInput" }
      responses:
        "201":
          description: BOM created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BomDetail" }
        "400": { description: Invalid request body }
        "403": { description: Insufficient role (supervisor/director only) }
        "404": { description: Model or material not found }
        "409": { description: Revision conflict }

  /boms/{id}:
    get:
      operationId: getBom
      tags: [bom]
      summary: Get a BOM (header + lines)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: BOM detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BomDetail" }
        "404": { description: BOM not found }
    put:
      operationId: updateBom
      tags: [bom]
      summary: Update a draft BOM (replaces header fields + lines; draft only)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BomUpdateInput" }
      responses:
        "200":
          description: BOM updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BomDetail" }
        "400": { description: Invalid request body }
        "403": { description: Insufficient role (supervisor/director only) }
        "404": { description: BOM or material not found }
        "422": { description: BOM is not editable (only draft BOMs can be edited) }
    delete:
      operationId: deleteBom
      tags: [bom]
      summary: Delete a draft BOM (draft only)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204": { description: Deleted }
        "403": { description: Insufficient role (supervisor/director only) }
        "404": { description: BOM not found }
        "422": { description: Only draft BOMs can be deleted }

  /boms/{id}/approve:
    post:
      operationId: approveBom
      tags: [bom]
      summary: Approve a draft BOM (draft → approved)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: BOM approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BomDetail" }
        "403": { description: Insufficient role (supervisor/director only) }
        "404": { description: BOM not found }
        "422": { description: Only draft BOMs can be approved }

  /boms/{id}/obsolete:
    post:
      operationId: obsoleteBom
      tags: [bom]
      summary: Mark an approved BOM obsolete (approved → obsolete)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: BOM obsoleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BomDetail" }
        "403": { description: Insufficient role (supervisor/director only) }
        "404": { description: BOM not found }
        "422": { description: Only approved BOMs can be made obsolete }

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StageParam:
      name: stage
      in: path
      required: true
      schema:
        type: string
        enum: [cell_allocation, assembly, compression, bms_allocation, bms_programming, charging, testing, quality_control, packing]
    SearchParam:
      name: search
      in: query
      required: false
      schema:
        type: string
    StatusParam:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [active, inactive]
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        default: 25

  schemas:
    # ─── MES — Bill of Materials (BOM Master) ─────────────────────────────────
    BomStatus:
      type: string
      enum: [draft, approved, obsolete]
    BomLineInput:
      type: object
      required: [material_id, quantity_per]
      properties:
        material_id: { type: string, format: uuid }
        quantity_per: { type: number }
        scrap_percent: { type: number, default: 0 }
        is_critical_component: { type: boolean, default: false }
        traceability_required: { type: boolean, default: false }
        is_optional: { type: boolean, default: false }
        position: { type: integer, default: 0 }
        notes: { type: string, nullable: true }
    BomInput:
      type: object
      required: [model_id, lines]
      properties:
        model_id: { type: string, format: uuid }
        name: { type: string, nullable: true }
        yield_percent: { type: number, default: 100 }
        effective_from: { type: string, format: date, nullable: true }
        effective_to: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/BomLineInput" }
    BomUpdateInput:
      type: object
      required: [lines]
      properties:
        name: { type: string, nullable: true }
        yield_percent: { type: number, default: 100 }
        effective_from: { type: string, format: date, nullable: true }
        effective_to: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/BomLineInput" }
    BomLine:
      type: object
      required:
        - id
        - bom_id
        - material_id
        - position
        - quantity_per
        - uom
        - scrap_percent
        - is_critical_component
        - traceability_required
        - is_optional
      properties:
        id: { type: string, format: uuid }
        bom_id: { type: string, format: uuid }
        material_id: { type: string, format: uuid }
        material_code: { type: string, nullable: true }
        material_name: { type: string, nullable: true }
        position: { type: integer }
        quantity_per: { type: number }
        uom: { type: string }
        scrap_percent: { type: number }
        is_critical_component: { type: boolean }
        traceability_required: { type: boolean }
        is_optional: { type: boolean }
        alternate_of_line_id: { type: string, format: uuid, nullable: true }
        notes: { type: string, nullable: true }
    Bom:
      type: object
      required:
        - id
        - bom_number
        - model_id
        - revision
        - status
        - yield_percent
        - line_count
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        bom_number: { type: string }
        model_id: { type: string, format: uuid }
        model_code: { type: string, nullable: true }
        model_name: { type: string, nullable: true }
        revision: { type: integer }
        status: { $ref: "#/components/schemas/BomStatus" }
        name: { type: string, nullable: true }
        yield_percent: { type: number }
        effective_from: { type: string, format: date, nullable: true }
        effective_to: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true }
        line_count: { type: integer }
        created_by: { type: string, nullable: true }
        approved_by: { type: string, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BomDetail:
      allOf:
        - $ref: "#/components/schemas/Bom"
        - type: object
          required: [lines]
          properties:
            lines:
              type: array
              items: { $ref: "#/components/schemas/BomLine" }
    BomListResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Bom" }
        meta:
          type: object
          required: [total, page, pageSize]
          properties:
            total: { type: integer }
            page: { type: integer }
            pageSize: { type: integer }

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MasterStatus:
      type: string
      enum: [active, inactive]

    MasterStatusToggle:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/MasterStatus"

    Attachment:
      type: object
      required: [id, name, url, fileType, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string }
        fileType: { type: string }
        uploadedAt: { type: string, format: date-time }

    MasterCommon:
      type: object
      required: [id, code, name, status, revision_number, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/MasterStatus" }
        revision_number: { type: integer }
        effective_date: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
        created_by: { type: ["string", "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_by: { type: ["string", "null"], format: uuid }
        updated_at: { type: string, format: date-time }

    MasterCommonInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: ["string", "null"], maxLength: 2000 }
        effective_date: { type: ["string", "null"] }
        notes: { type: ["string", "null"], maxLength: 2000 }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }

    MasterCommonUpdate:
      type: object
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: ["string", "null"], maxLength: 2000 }
        effective_date: { type: ["string", "null"] }
        notes: { type: ["string", "null"], maxLength: 2000 }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }

    MasterListMeta:
      type: object
      required: [total, page, pageSize, totalPages]
      properties:
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }

    MasterListResponse:
      type: object
      required: [items, meta]
      properties:
        meta: { $ref: "#/components/schemas/MasterListMeta" }

    # Product Master
    ProductMaster:
      allOf:
        - $ref: "#/components/schemas/MasterCommon"
        - type: object
          properties:
            chemistry: { type: string }
            category: { type: string }
            category_id: { type: ["string", "null"], format: uuid }
            nominal_voltage_v: { type: number }
            capacity_ah: { type: number }
            energy_kwh: { type: number }
            configuration: { type: string }
            cell_count: { type: integer }
            bms_master_id: { type: ["string", "null"], format: uuid }
            cabinet_master_id: { type: ["string", "null"], format: uuid }
            cell_master_id: { type: ["string", "null"], format: uuid }
            warranty_period_months: { type: integer }
            product_image_url: { type: ["string", "null"] }

    ProductMasterInput:
      allOf:
        - $ref: "#/components/schemas/MasterCommonInput"
        - type: object
          required: [chemistry, category, nominal_voltage_v, capacity_ah, energy_kwh, configuration, cell_count, warranty_period_months]
          properties:
            chemistry: { type: string }
            category: { type: string }
            nominal_voltage_v: { type: number }
            capacity_ah: { type: number }
            energy_kwh: { type: number }
            configuration: { type: string }
            cell_count: { type: integer }
            bms_master_id: { type: ["string", "null"], format: uuid }
            cabinet_master_id: { type: ["string", "null"], format: uuid }
            cell_master_id: { type: ["string", "null"], format: uuid }
            warranty_period_months: { type: integer }
            product_image_url: { type: ["string", "null"] }

    ProductMasterUpdate:
      allOf:
        - $ref: "#/components/schemas/MasterCommonUpdate"
        - type: object
          properties:
            chemistry: { type: string }
            category: { type: string }
            nominal_voltage_v: { type: number }
            capacity_ah: { type: number }
            energy_kwh: { type: number }
            configuration: { type: string }
            cell_count: { type: integer }
            bms_master_id: { type: ["string", "null"], format: uuid }
            cabinet_master_id: { type: ["string", "null"], format: uuid }
            cell_master_id: { type: ["string", "null"], format: uuid }
            warranty_period_months: { type: integer }
            product_image_url: { type: ["string", "null"] }

    # Cell Master
    CellMaster:
      allOf:
        - $ref: "#/components/schemas/MasterCommon"
        - type: object
          properties:
            manufacturer: { type: string }
            model: { type: string }
            chemistry: { type: string }
            capacity_mah: { type: number }
            nominal_voltage_v: { type: number }
            max_voltage_v: { type: number }
            min_voltage_v: { type: number }
            weight_g: { type: number }
            dimensions: { type: string }
            internal_resistance_spec_mohm: { type: number }
            cycle_life: { type: integer }
            datasheet_url: { type: ["string", "null"] }
            approved_supplier: { type: ["string", "null"] }

    CellMasterInput:
      allOf:
        - $ref: "#/components/schemas/MasterCommonInput"
        - type: object
          required: [manufacturer, model, chemistry, capacity_mah, nominal_voltage_v, max_voltage_v, min_voltage_v, weight_g, dimensions, internal_resistance_spec_mohm, cycle_life]
          properties:
            manufacturer: { type: string }
            model: { type: string }
            chemistry: { type: string }
            capacity_mah: { type: number }
            nominal_voltage_v: { type: number }
            max_voltage_v: { type: number }
            min_voltage_v: { type: number }
            weight_g: { type: number }
            dimensions: { type: string }
            internal_resistance_spec_mohm: { type: number }
            cycle_life: { type: integer }
            datasheet_url: { type: ["string", "null"] }
            approved_supplier: { type: ["string", "null"] }

    CellMasterUpdate:
      allOf:
        - $ref: "#/components/schemas/MasterCommonUpdate"
        - type: object
          properties:
            manufacturer: { type: string }
            model: { type: string }
            chemistry: { type: string }
            capacity_mah: { type: number }
            nominal_voltage_v: { type: number }
            max_voltage_v: { type: number }
            min_voltage_v: { type: number }
            weight_g: { type: number }
            dimensions: { type: string }
            internal_resistance_spec_mohm: { type: number }
            cycle_life: { type: integer }
            datasheet_url: { type: ["string", "null"] }
            approved_supplier: { type: ["string", "null"] }

    # BMS Master
    BmsMaster:
      allOf:
        - $ref: "#/components/schemas/MasterCommon"
        - type: object
          properties:
            manufacturer: { type: string }
            model: { type: string }
            current_rating_a: { type: number }
            min_voltage_v: { type: number }
            max_voltage_v: { type: number }
            cell_support_count: { type: integer }
            has_bluetooth: { type: boolean }
            has_can: { type: boolean }
            has_rs485: { type: boolean }
            has_uart: { type: boolean }
            firmware_version: { type: ["string", "null"] }
            datasheet_url: { type: ["string", "null"] }

    BmsMasterInput:
      allOf:
        - $ref: "#/components/schemas/MasterCommonInput"
        - type: object
          required: [manufacturer, model, current_rating_a, min_voltage_v, max_voltage_v, cell_support_count]
          properties:
            manufacturer: { type: string }
            model: { type: string }
            current_rating_a: { type: number }
            min_voltage_v: { type: number }
            max_voltage_v: { type: number }
            cell_support_count: { type: integer }
            has_bluetooth: { type: boolean, default: false }
            has_can: { type: boolean, default: false }
            has_rs485: { type: boolean, default: false }
            has_uart: { type: boolean, default: false }
            firmware_version: { type: ["string", "null"] }
            datasheet_url: { type: ["string", "null"] }

    BmsMasterUpdate:
      allOf:
        - $ref: "#/components/schemas/MasterCommonUpdate"
        - type: object
          properties:
            manufacturer: { type: string }
            model: { type: string }
            current_rating_a: { type: number }
            min_voltage_v: { type: number }
            max_voltage_v: { type: number }
            cell_support_count: { type: integer }
            has_bluetooth: { type: boolean }
            has_can: { type: boolean }
            has_rs485: { type: boolean }
            has_uart: { type: boolean }
            firmware_version: { type: ["string", "null"] }
            datasheet_url: { type: ["string", "null"] }

    # Cabinet Master
    CabinetMaster:
      allOf:
        - $ref: "#/components/schemas/MasterCommon"
        - type: object
          properties:
            model: { type: string }
            material: { type: string }
            ip_rating: { type: string }
            dimensions: { type: string }
            weight_kg: { type: number }
            colour: { type: string }
            mounting_type: { type: string }

    CabinetMasterInput:
      allOf:
        - $ref: "#/components/schemas/MasterCommonInput"
        - type: object
          required: [model, material, ip_rating, dimensions, weight_kg, colour, mounting_type]
          properties:
            model: { type: string }
            material: { type: string }
            ip_rating: { type: string }
            dimensions: { type: string }
            weight_kg: { type: number }
            colour: { type: string }
            mounting_type: { type: string }

    CabinetMasterUpdate:
      allOf:
        - $ref: "#/components/schemas/MasterCommonUpdate"
        - type: object
          properties:

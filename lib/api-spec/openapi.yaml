      required: [componentType, componentName, quantity]
      properties:
        componentType: { type: string }
        componentId: { type: ["string", "null"], format: uuid }
        componentName: { type: string }
        quantity: { type: integer, minimum: 1 }
        serialNumber: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }

    ProductionOrder:
      type: object
      required: [id, orderNumber, batteryNumber, factoryManager, priority, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string }
        batteryNumber: { type: string }
        productId: { type: ["string", "null"], format: uuid }
        factoryManager: { type: string }
        currentStage:
          type: ["string", "null"]
          enum: [cell_allocation, bms_allocation, assembly, compression, charging, testing, quality_control, packing, "null"]
        priority:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [draft, released, in_progress, completed, cancelled]
        plannedStartDate: { type: ["string", "null"] }
        plannedEndDate: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProductionOrderDetail:
      allOf:
        - $ref: "#/components/schemas/ProductionOrder"
        - type: object
          properties:
            stages:
              type: array
              items:
                $ref: "#/components/schemas/OrderStage"

    ProductionOrderInput:
      type: object
      required: [factoryManager, priority]
      properties:
        productId: { type: ["string", "null"], format: uuid }
        factoryManager: { type: string }
        priority:
          type: string
          enum: [low, medium, high]
          default: medium
        plannedStartDate: { type: ["string", "null"] }
        plannedEndDate: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }

    ProductionOrderUpdate:
      type: object
      properties:
        factoryManager: { type: string }
        priority:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [draft, released, in_progress, completed, cancelled]
        plannedStartDate: { type: ["string", "null"] }
        plannedEndDate: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }

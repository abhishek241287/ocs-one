  # ── Manufacturing — Production Orders ───────────────────────────────────────
  /manufacturing/orders:
    get:
      operationId: listProductionOrders
      tags: [manufacturing]
      summary: List production orders
      parameters:
        - $ref: "#/components/parameters/SearchParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, released, in_progress, completed, cancelled]
        - name: priority
          in: query
          required: false
          schema:
            type: string
            enum: [low, medium, high]
        - name: stage
          in: query
          required: false
          description: Filter orders to those currently at a given manufacturing stage (e.g. quality_control for the QC queue).
          schema:
            type: string
            enum:
              - cell_allocation
              - bms_allocation
              - assembly
              - compression
              - charging
              - testing
              - quality_control
              - packing
      responses:
        "200":
          description: List of production orders
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProductionOrder"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
    post:
      operationId: createProductionOrder
      tags: [manufacturing]
      summary: Create production order (auto-generates battery number + 8 stages)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionOrderInput"
      responses:
        "201":
          description: Created order with stages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionOrderDetail"

  /manufacturing/orders/{id}:
    get:
      operationId: getProductionOrder
      tags: [manufacturing]
      summary: Get production order with stages, timeline, and genealogy
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Production order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionOrderDetail"
        "404":
          description: Not found
    patch:
      operationId: updateProductionOrder
      tags: [manufacturing]
      summary: Update production order header fields
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:

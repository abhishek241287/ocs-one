openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: masters
    description: Engineering Master Data operations
  - name: manufacturing
    description: Manufacturing Execution System operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Product Masters
  /masters/products:
    get:
      operationId: listProductMasters
      tags: [masters]
      parameters:
        - $ref: "#/components/parameters/SearchParam"
        - $ref: "#/components/parameters/StatusParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: List of product masters
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/MasterListResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ProductMaster"
    post:
      operationId: createProductMaster
      tags: [masters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductMasterInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductMaster"

  /masters/products/{id}:

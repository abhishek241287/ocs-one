  # ── Manufacturing — Production Orders ───────────────────────────────────────
  /manufacturing/orders:
    get:
      operationId: listProductionOrders
      tags: [manufacturing]
      summary: List production orders
      parameters:
        - $ref: "#/components/parameters/SearchParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, released, in_progress, completed, cancelled]
        - name: priority
          in: query
          required: false
          schema:
            type: string
            enum: [low, medium, high]
      responses:
        "200":
          description: List of production orders
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProductionOrder"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
    post:
      operationId: createProductionOrder
      tags: [manufacturing]
      summary: Create production order (auto-generates battery number + 8 stages)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionOrderInput"
      responses:
        "201":
          description: Created order with stages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionOrderDetail"

  /manufacturing/orders/{id}:
    get:
      operationId: getProductionOrder
      tags: [manufacturing]
      summary: Get production order with stages, timeline, and genealogy
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Production order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionOrderDetail"
        "404":
          description: Not found
    patch:
      operationId: updateProductionOrder
      tags: [manufacturing]
      summary: Update production order header fields
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionOrderUpdate"
      responses:
        "200":
          description: Updated production order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionOrderDetail"

  # ── Manufacturing — Stages ────────────────────────────────────────────────
  /manufacturing/orders/{id}/stages:
    get:
      operationId: listOrderStages
      tags: [manufacturing]
      summary: List all 8 stages for a production order
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: All stages
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrderStage"

  /manufacturing/orders/{id}/stages/{stage}:
    get:
      operationId: getOrderStage
      tags: [manufacturing]
      summary: Get a specific stage
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/StageParam"
      responses:
        "200":
          description: Stage detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStage"
    patch:
      operationId: updateOrderStage
      tags: [manufacturing]
      summary: Save stage form data (notes, stageData) without transitioning status
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/StageParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageUpdate"
      responses:
        "200":
          description: Updated stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStage"

  /manufacturing/orders/{id}/stages/{stage}/start:
    post:
      operationId: startStage
      tags: [manufacturing]
      summary: Start a stage (pending → in_progress)
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/StageParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageStartInput"
      responses:
        "200":
          description: Stage started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStage"

  /manufacturing/orders/{id}/stages/{stage}/complete:
    post:
      operationId: completeStage
      tags: [manufacturing]
      summary: Complete a stage (in_progress → completed)
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/StageParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageCompleteInput"
      responses:
        "200":
          description: Stage completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStage"

  /manufacturing/orders/{id}/stages/{stage}/approve:
    post:
      operationId: approveStage
      tags: [manufacturing]
      summary: Approve a completed stage (completed → approved)
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/StageParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageApproveInput"
      responses:
        "200":
          description: Stage approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStage"

  /manufacturing/orders/{id}/stages/{stage}/reject:
    post:
      operationId: rejectStage
      tags: [manufacturing]
      summary: Reject a completed stage (completed → rejected)
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/StageParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageRejectInput"
      responses:
        "200":
          description: Stage rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStage"

  # ── Manufacturing — Timeline ──────────────────────────────────────────────
  /manufacturing/orders/{id}/timeline:
    get:
      operationId: getOrderTimeline
      tags: [manufacturing]
      summary: Immutable append-only event log for a battery/order
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Timeline events newest-first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TimelineEvent"

  # ── Manufacturing — Genealogy ─────────────────────────────────────────────
  /manufacturing/orders/{id}/genealogy:
    get:
      operationId: getOrderGenealogy
      tags: [manufacturing]
      summary: Component BOM for a battery
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Genealogy records
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/GenealogyRecord"
    post:
      operationId: addGenealogyRecord
      tags: [manufacturing]
      summary: Add a component to battery genealogy
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenealogyInput"
      responses:
        "201":
          description: Created genealogy record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenealogyRecord"

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StageParam:
      name: stage
      in: path
      required: true
      schema:
        type: string
        enum: [cell_allocation, bms_allocation, assembly, compression, charging, testing, quality_control, packing]
    SearchParam:
      name: search
      in: query
      required: false
      schema:
        type: string
    StatusParam:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [active, inactive]
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        default: 25

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MasterStatus:
      type: string
      enum: [active, inactive]

    MasterStatusToggle:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/MasterStatus"

    Attachment:
      type: object
      required: [id, name, url, fileType, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string }
        fileType: { type: string }
        uploadedAt: { type: string, format: date-time }

    MasterCommon:
      type: object
      required: [id, code, name, status, revision_number, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/MasterStatus" }
        revision_number: { type: integer }
        effective_date: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
        created_by: { type: ["string", "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_by: { type: ["string", "null"], format: uuid }
        updated_at: { type: string, format: date-time }

    MasterCommonInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        effective_date: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }

    MasterCommonUpdate:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        effective_date: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }

    MasterListMeta:
      type: object
      required: [total, page, pageSize, totalPages]
      properties:
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }

    MasterListResponse:
      type: object
      required: [items, meta]
      properties:
        meta: { $ref: "#/components/schemas/MasterListMeta" }

    # Product Master
    ProductMaster:
      allOf:
        - $ref: "#/components/schemas/MasterCommon"

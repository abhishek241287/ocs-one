      type: object
      required: [id, cellId, lotId, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        cellId: { type: string }
        lotId: { type: string, format: uuid }
        status:
          type: string
          enum: [received, grading, approved, rejected, quarantine, reserved, allocated]
        grade:
          type: ["string", "null"]
          enum: [A, B, C, reject, "null"]
        voltageV: { type: ["number", "null"] }
        capacityAh: { type: ["number", "null"] }
        internalResistanceMohm: { type: ["number", "null"] }
        temperatureC: { type: ["number", "null"] }
        gradingMachineId: { type: ["string", "null"] }
        gradedBy: { type: ["string", "null"] }
        gradedAt: { type: ["string", "null"], format: date-time }
        gradingNotes: { type: ["string", "null"] }
        matchId: { type: ["string", "null"], format: uuid }
        allocationOrderId: { type: ["string", "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CellDetail:
      allOf:
        - $ref: "#/components/schemas/Cell"
        - type: object
          properties:
            lot:
              $ref: "#/components/schemas/CellLot"
            usedInOrders:
              type: array
              items:
                type: object
                properties:
                  orderId: { type: string, format: uuid }
                  orderNumber: { type: string }
                  batteryNumber: { type: string }

    CellGradeInput:
      type: object
      required: [voltageV, capacityAh, internalResistanceMohm, gradedBy]
      properties:
        # DEF-CW02-004: strict engineering validation — physically-impossible
        # measurements are rejected at the schema (API + frontend + generated clients
        # share one source of truth). capacity & voltage are strictly positive;
        # internal resistance is non-negative.
        voltageV: { type: number, exclusiveMinimum: 0 }
        capacityAh: { type: number, exclusiveMinimum: 0 }
        internalResistanceMohm: { type: number, minimum: 0 }
        temperatureC: { type: ["number", "null"] }
        gradingMachineId: { type: ["string", "null"] }
        # DEF-CW02-005: operator attribution is mandatory and non-blank (server
        # also trims whitespace before validating — audit records never carry an
        # anonymous operator).
        gradedBy: { type: string, minLength: 1 }
        gradingNotes: { type: ["string", "null"] }
        overrideStatus:
          type: ["string", "null"]
          enum: [approved, rejected, quarantine, "null"]

    # DEF-CW02-006: controlled correction workflow. Only Supervisor/Director may
    # reopen a graded cell; a correction reason is mandatory; the original
    # measurement is preserved immutably and the correction is appended as a new
    # measurement record (full history reconstructable).
    CellCorrectionInput:
      type: object
      required: [voltageV, capacityAh, internalResistanceMohm, correctedBy, correctionReason]
      properties:
        voltageV: { type: number, exclusiveMinimum: 0 }
        capacityAh: { type: number, exclusiveMinimum: 0 }
        internalResistanceMohm: { type: number, minimum: 0 }
        temperatureC: { type: ["number", "null"] }
        gradingMachineId: { type: ["string", "null"] }
        correctedBy: { type: string, minLength: 1 }
        correctionReason: { type: string, minLength: 1 }
        gradingNotes: { type: ["string", "null"] }
        overrideStatus:
          type: ["string", "null"]
          enum: [approved, rejected, quarantine, "null"]

    CellMeasurement:
      type: object
      required: [id, correctionId, cellId, sequence, measurementType, voltageV, capacityAh, internalResistanceMohm, grade, status, gradedBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        correctionId: { type: string, description: "Globally-unique engineering Correction ID (CORR-YYYYMMDD-NNNNNN) from the Engineering Correction Framework." }
        cellId: { type: string, format: uuid }
        lotId: { type: ["string", "null"], format: uuid }
        sequence: { type: integer }
        measurementType: { type: string, enum: [original, correction] }
        voltageV: { type: number }
        capacityAh: { type: number }
        internalResistanceMohm: { type: number }
        temperatureC: { type: ["number", "null"] }
        gradingMachineId: { type: ["string", "null"] }
        grade: { type: ["string", "null"], enum: [A, B, C, reject, "null"] }
        status: { type: string }
        overrideStatus: { type: ["string", "null"] }
        gradedBy: { type: string }
        correctionReason: { type: ["string", "null"] }
        gradingNotes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    CellInventorySummary:
      type: object
      required: [total, received, approved, rejected, quarantine, reserved, allocated, available, gradedToday, receivedToday, approvedPct, rejectedPct]
      properties:
        total: { type: integer }
        received: { type: integer }
        approved: { type: integer }
        rejected: { type: integer }
        quarantine: { type: integer }
        reserved: { type: integer }
        allocated: { type: integer }
        available: { type: integer }
        gradedToday: { type: integer }
        receivedToday: { type: integer }
        approvedPct: { type: number }
        rejectedPct: { type: number }

    CellMatch:
      type: object
      required: [id, batteryModel, cellsPerBattery, quantity, status, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        productId: { type: ["string", "null"], format: uuid }
        batteryModel: { type: string }
        cellsPerBattery: { type: integer }
        quantity: { type: integer }
        status:
          type: string
          enum: [draft, reserved, allocated, cancelled]
        matchScore: { type: ["number", "null"] }
        createdBy: { type: string }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CellMatchInput:
      type: object
      required: [batteryModel, quantity, createdBy]
      properties:
        productId: { type: ["string", "null"], format: uuid }
        batteryModel: { type: string }
        cellsPerBattery: { type: integer, default: 16 }
        quantity: { type: integer, minimum: 1 }
        createdBy: { type: string }
        notes: { type: ["string", "null"] }

    CellMatchBattery:
      type: object
      required: [slot, cells, avgCapacityAh, maxCapacityDiff, avgIrMohm, maxIrDiff, matchScore]
      properties:
        slot: { type: integer }
        cells:
          type: array
          items:
            $ref: "#/components/schemas/Cell"
        avgCapacityAh: { type: number }
        maxCapacityDiff: { type: number }
        avgIrMohm: { type: number }
        maxIrDiff: { type: number }
        matchScore: { type: number }

    CellMatchDetail:
      allOf:
        - $ref: "#/components/schemas/CellMatch"
        - type: object
          properties:
            batteries:
              type: array
              items:
                $ref: "#/components/schemas/CellMatchBattery"

    CellGradeConfig:
      type: object
      required: [id, gradeAMinCapacityPct, gradeAMaxIrMult, gradeBMinCapacityPct, gradeBMaxIrMult, gradeCMinCapacityPct, gradeCMaxIrMult, maxCapacityDiffAh, maxIrDiffMohm, maxVoltageDiffMv, nominalIrMohm, updatedAt]
      properties:
        id: { type: integer }
        gradeAMinCapacityPct: { type: number }
        gradeAMaxIrMult: { type: number }
        gradeBMinCapacityPct: { type: number }
        gradeBMaxIrMult: { type: number }
        gradeCMinCapacityPct: { type: number }
        gradeCMaxIrMult: { type: number }
        maxCapacityDiffAh: { type: number }
        maxIrDiffMohm: { type: number }
        maxVoltageDiffMv: { type: number }
        nominalIrMohm: { type: number }
        updatedAt: { type: string, format: date-time }

    TestResult:
      type: object
      required: [id, productionOrderId, testType, operatorName, result, testData, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        productionOrderId: { type: string, format: uuid }
        testType: { type: string, enum: [capacity, charge_discharge, protection, internal_resistance] }
        testEquipmentId: { type: ["string", "null"], format: uuid }
        testEquipmentName: { type: ["string", "null"] }
        operatorName: { type: string }
        startedAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        result: { type: string, enum: [pass, fail, warning] }
        testData: { type: object, additionalProperties: true }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TestResultInput:
      type: object
      required: [operatorName, result, testData]
      properties:
        testEquipmentId: { type: ["string", "null"], format: uuid }
        testEquipmentName: { type: ["string", "null"] }
        operatorName: { type: string }
        startedAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        result: { type: string, enum: [pass, fail, warning] }
        testData: { type: object, additionalProperties: true }
        notes: { type: ["string", "null"] }

    QcApproval:
      type: object
      required: [id, productionOrderId, decision, inspectorName, inspectorRole, approvedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        productionOrderId: { type: string, format: uuid }
        decision: { type: string, enum: [approved, rejected] }
        inspectorName: { type: string }
        inspectorRole: { type: string }
        digitalSignature: { type: ["string", "null"] }
        remarks: { type: ["string", "null"] }
        approvedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        reworkTicketId: { type: ["string", "null"], format: uuid }

    QcApprovalInput:
      type: object
      required: [decision, inspectorName]
      properties:
        decision: { type: string, enum: [approved, rejected] }
        inspectorName: { type: string }
        inspectorRole: { type: string }
        digitalSignature: { type: ["string", "null"] }
        remarks: { type: ["string", "null"] }
        failedTests: { type: array, items: { type: string } }
        failureReason: { type: ["string", "null"] }

    ReworkTicket:
      type: object
      required: [id, ticketNumber, productionOrderId, batteryNumber, failedTests, failureReason, status, retestRequired, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ticketNumber: { type: string }
        productionOrderId: { type: string, format: uuid }
        batteryNumber: { type: string }
        failedTests: { type: array, items: { type: string } }
        failureReason: { type: string }
        status: { type: string, enum: [open, in_progress, resolved, closed] }
        assignedTechnician: { type: ["string", "null"] }
        correctiveAction: { type: ["string", "null"] }
        retestRequired: { type: boolean }
        resolvedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ReworkTicketUpdate:
      type: object
      properties:
        status: { type: string, enum: [open, in_progress, resolved, closed] }
        assignedTechnician: { type: ["string", "null"] }
        correctiveAction: { type: ["string", "null"] }
        retestRequired: { type: boolean }

    TestingDashboard:
      type: object
      required: [batteriesUnderTest, passedToday, failedToday, reworkQueueCount, qcPendingCount, avgTestTimeHrs]
      properties:
        batteriesUnderTest: { type: integer }
        passedToday: { type: integer }
        failedToday: { type: integer }
        reworkQueueCount: { type: integer }
        qcPendingCount: { type: integer }
        avgTestTimeHrs: { type: ["number", "null"] }

    CellGradeConfigInput:
      type: object
      properties:
        gradeAMinCapacityPct: { type: number }
        gradeAMaxIrMult: { type: number }
        gradeBMinCapacityPct: { type: number }
        gradeBMaxIrMult: { type: number }
        gradeCMinCapacityPct: { type: number }
        gradeCMaxIrMult: { type: number }
        maxCapacityDiffAh: { type: number }
        maxIrDiffMohm: { type: number }
        maxVoltageDiffMv: { type: number }
        nominalIrMohm: { type: number }

    # ── Logistics ────────────────────────────────────────────────────────────────
    Dealer:
      type: object
      required: [id, dealerCode, dealerName, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        dealerCode: { type: string }
        dealerName: { type: string }
        gstNumber: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        contactPerson: { type: ["string", "null"] }
        mobile: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        territory: { type: ["string", "null"] }
        creditLimit: { type: ["number", "null"] }
        status: { type: string, enum: [active, inactive] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DealerInput:
      type: object
      required: [dealerCode, dealerName]
      properties:
        dealerCode: { type: string }
        dealerName: { type: string }
        # DEF-DLR-003: GST must be a valid 15-char Indian GSTIN when provided.
        gstNumber: { type: string, pattern: '^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][0-9A-Z]Z[0-9A-Z]$' }
        address: { type: string }
        contactPerson: { type: string }
        # DEF-DLR-003: 10-digit Indian mobile, optional +91 / 0 prefix, when provided.
        mobile: { type: string, pattern: '^(\+91[- ]?|0)?[6-9][0-9]{9}$' }
        # DEF-DLR-003: valid email format when provided.
        email: { type: string, format: email }
        territory: { type: string }
        # DEF-DLR-003: credit limit cannot be negative.
        creditLimit: { type: number, minimum: 0 }
        status: { type: string, enum: [active, inactive] }

    DispatchOrder:
      type: object
      required: [id, dispatchNumber, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        dispatchNumber: { type: string }
        dealerId: { type: ["string", "null"], format: uuid }
        customerName: { type: ["string", "null"] }
        transporter: { type: ["string", "null"] }
        vehicleNumber: { type: ["string", "null"] }
        driverName: { type: ["string", "null"] }
        driverMobile: { type: ["string", "null"] }
        dispatchDate: { type: ["string", "null"], format: date }
        status: { type: string, enum: [draft, confirmed, loaded, in_transit, delivered, cancelled] }
        notes: { type: ["string", "null"] }
        createdBy: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DispatchOrderDetail:
      allOf:
        - $ref: "#/components/schemas/DispatchOrder"
        - type: object
          required: [items, shipmentEvents]
          properties:
            dealer:
              $ref: "#/components/schemas/Dealer"
            items:
              type: array
              items: { $ref: "#/components/schemas/DispatchItem" }
            shipmentEvents:
              type: array
              items: { $ref: "#/components/schemas/ShipmentEvent" }

    DispatchOrderInput:
      type: object
      properties:
        dealerId: { type: string, format: uuid }
        customerName: { type: string }
        transporter: { type: string }
        vehicleNumber: { type: string }
        driverName: { type: string }
        driverMobile: { type: string }
        dispatchDate: { type: string, format: date }
        notes: { type: string }
        createdBy: { type: string }

    DispatchItem:
      type: object
      required: [id, dispatchOrderId, productionOrderId, addedAt]
      properties:
        id: { type: string, format: uuid }
        dispatchOrderId: { type: string, format: uuid }
        productionOrderId: { type: string, format: uuid }
        batteryNumber: { type: string }
        orderNumber: { type: string }
        addedAt: { type: string, format: date-time }

    ShipmentEvent:
      type: object
      required: [id, dispatchOrderId, eventType, occurredAt]
      properties:
        id: { type: string, format: uuid }
        dispatchOrderId: { type: string, format: uuid }
        eventType: { type: string, enum: [ready_for_dispatch, loaded, in_transit, delivered, received_by_dealer] }
        actor: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        occurredAt: { type: string, format: date-time }

    PackingDashboard:
      type: object
      required: [readyForDispatch, packedToday, waitingDispatch, inTransit, deliveredToday]
      properties:
        readyForDispatch: { type: integer }
        packedToday: { type: integer }
        waitingDispatch: { type: integer }
        inTransit: { type: integer }
        deliveredToday: { type: integer }

    # ─── Auth schemas ─────────────────────────────────────────────────────────
    AuthUser:
      type: object
      required: [userId, email, name, role]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role:
          type: string
          enum: [director, supervisor, operator, viewer]

    UserAccount:
      type: object
      required: [id, email, name, role, dealerId, isActive, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role:
          type: string
          enum: [owner, director, supervisor, operator, viewer, dealer]
        dealerId: { type: ["string", "null"], format: uuid }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }

    UserDealerAssignment:
      type: object
      required: [dealerId]
      properties:
        dealerId: { type: ["string", "null"], format: uuid }

    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 8 }

    AdminUserUpdate:
      type: object
      minProperties: 1
      properties:
        role:
          type: string
          enum: [owner, director, supervisor, operator, viewer, dealer]
        isActive: { type: boolean }
        password: { type: string, minLength: 8 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }

    LoginResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    # ─── Director Dashboard schema ────────────────────────────────────────────
    DirectorDashboard:
      type: object
      required: [refreshedAt, kpis, pipeline, alerts, recentOrders, operatorActivity, equipmentStatus, qualitySummary, logistics, cellInventory, orderStats]
      properties:
        refreshedAt: { type: string, format: date-time }
        kpis:
          type: object
          description: Key performance indicators
          additionalProperties: true
        pipeline:
          type: array
          description: Stage-by-stage production pipeline
          items:
            type: object
            additionalProperties: true
        alerts:
          type: array
          description: Active alerts and blockers
          items:
            type: object
            additionalProperties: true
        recentOrders:
          type: array
          description: Recently updated production orders
          items:
            type: object
            additionalProperties: true
        operatorActivity:
          type: array
          description: Operator activity breakdown
          items:
            type: object
            additionalProperties: true
        equipmentStatus:
          type: object
          description: Charger and test equipment utilization
          additionalProperties: true
        qualitySummary:
          type: object
          description: QC pass/fail rates and rework stats
          additionalProperties: true
        logistics:
          type: object
          description: Dispatch and delivery summary
          additionalProperties: true
        cellInventory:
          type: object
          description: Cell stock levels by status and grade
          additionalProperties: true
        orderStats:
          type: object
          description: Order counts by status
          additionalProperties: true

    # ─── Unified Product Platform schemas ────────────────────────────────────
    ProductSerialSource:
      type: string
      enum: [OCS, MANUFACTURER]

    ProductStatus:
      type: string
      enum: [manufacturing, qc_passed, ready_for_packing, packed, dispatched, delivered_to_dealer]

    Product:
      type: object
      required:
        - id
        - category_id
        - model_id
        - workflow_code
        - official_product_serial
        - serial_source
        - product_status
        - manufacturing_completed_at
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        model_id: { type: string, format: uuid }
        workflow_code: { type: string }
        source_production_order_id: { type: ["string", "null"], format: uuid }
        official_product_serial: { type: string }
        serial_source: { $ref: "#/components/schemas/ProductSerialSource" }
        qc_status: { type: ["string", "null"] }
        product_status: { $ref: "#/components/schemas/ProductStatus" }
        current_location: { type: ["string", "null"] }
        dealer_id: { type: ["string", "null"], format: uuid }
        # Manufacturing completion — written once at QC PASS; downstream time reference.
        manufacturing_completed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        # Enriched (read-only) display fields joined for the UI.
        category_name: { type: ["string", "null"] }
        model_code: { type: ["string", "null"] }
        model_name: { type: ["string", "null"] }
        dealer_name: { type: ["string", "null"] }

    ProductListResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        meta: { $ref: "#/components/schemas/MasterListMeta" }

    ProductInventoryCategoryCount:
      type: object
      required: [category_name, count]
      properties:
        category_id: { type: ["string", "null"], format: uuid }
        category_name: { type: string }
        count: { type: integer }

    ProductInventorySummary:
      type: object
      required:
        [total, available, ready_for_packing, packed, dispatched, dealer_stock, quarantined, by_status, by_category]
      properties:
        total: { type: integer }
        available: { type: integer }
        ready_for_packing: { type: integer }
        packed: { type: integer }
        dispatched: { type: integer }
        dealer_stock: { type: integer }
        quarantined: { type: integer }
        by_status:
          type: object
          additionalProperties: { type: integer }
        by_category:
          type: array
          items: { $ref: "#/components/schemas/ProductInventoryCategoryCount" }

    ProductGenealogyRecord:
      type: object
      required: [id, product_id, component_type, component_name, quantity, created_at]
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        component_type: { type: string }
        component_id: { type: ["string", "null"], format: uuid }
        component_name: { type: string }
        quantity: { type: integer }
        serial_number: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        created_at: { type: string, format: date-time }

    ProductGenealogyResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProductGenealogyRecord" }

    ProductEvent:
      type: object
      required: [id, product_id, event_type, actor, description, created_at]
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        event_type: { type: string }
        actor: { type: string }
        description: { type: string }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }

    ProductEventsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProductEvent" }

    ProductTraceabilityTimelineEntry:
      type: object
      required: [source, event_type, actor, description]
      properties:
        source: { type: string, enum: [product, manufacturing] }
        event_type: { type: string }
        actor: { type: string }
        description: { type: string }
        timestamp: { type: string, format: date-time, nullable: true }
        metadata: { type: object, additionalProperties: true, nullable: true }

    ProductTraceability:
      type: object
      required: [product, is_imported, fulfillment, timeline]
      properties:
        product: { $ref: "#/components/schemas/Product" }
        is_imported: { type: boolean }
        manufacturing:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            Present for manufactured products (production order, material issue
            notes, BOM versions, materials consumed, GRN links, QC + test
            results). Null for imported products.
        imported:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            Present for imported products (source GRN, OEM/OCS serial provenance,
            category). Null for manufactured products.
        fulfillment:
          type: object
          required: [dispatches]
          properties:
            packing: { type: object, additionalProperties: true, nullable: true }
            dispatches:
              type: array
              items: { type: object, additionalProperties: true }
        customer: { type: object, additionalProperties: true, nullable: true }
        warranty: { type: object, additionalProperties: true, nullable: true }
        timeline:
          type: array
          items: { $ref: "#/components/schemas/ProductTraceabilityTimelineEntry" }

    ProductStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/ProductStatus" }
        reason: { type: string }

    # ─── Imported Product Registration (G1) ───────────────────────────────────
    ImportedProductInput:
      type: object
      required: [model_id]
      properties:
        model_id: { type: string, format: uuid }
        # Optional traceability link to the posted+inspected GRN the goods arrived on.
        source_grn_id: { type: ["string", "null"], format: uuid }
        # OCS-serialized categories (Lithium Inverter): how many units to mint.
        quantity: { type: integer, minimum: 1 }
        # Manufacturer-serialized categories (Hybrid Inverter): capture the OEM serials.
        oem_serials:
          type: array
          items: { type: string, minLength: 1 }
        notes: { type: string }

    ImportedProductResult:
      type: object
      required: [created, items]
      properties:
        created: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }

    # ─── Customer Registration (G3) ────────────────────────────────────────────
    CustomerRegistration:
      type: object
      required:
        [id, registration_number, product_id, dealer_id, customer_name, mobile, address, installation_date, registered_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        registration_number: { type: string }
        product_id: { type: string, format: uuid }
        dealer_id: { type: string, format: uuid }
        customer_name: { type: string }
        mobile: { type: string }
        address: { type: string }
        installation_date: { type: string, format: date }
        registered_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        # Enriched (read-only) display fields joined for the UI.
        product_serial: { type: ["string", "null"] }
        product_status: { type: ["string", "null"] }
        category_name: { type: ["string", "null"] }
        model_name: { type: ["string", "null"] }
        dealer_name: { type: ["string", "null"] }

    CustomerRegistrationDetail:
      allOf:
        - $ref: "#/components/schemas/CustomerRegistration"
        - type: object
          required: [warranty]
          properties:
            warranty: { $ref: "#/components/schemas/Warranty" }

    CustomerRegistrationListResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CustomerRegistration" }
        meta: { $ref: "#/components/schemas/MasterListMeta" }

    CustomerRegistrationInput:
      type: object
      required: [product_serial, customer_name, mobile, address, installation_date]
      properties:
        product_serial: { type: string, minLength: 1 }
        customer_name: { type: string, minLength: 1 }
        mobile: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        installation_date: { type: string, format: date }
        # Optional; defaults to the product's assigned dealer when omitted.
        dealer_id: { type: string, format: uuid }

    # ─── Warranty (G4) ─────────────────────────────────────────────────────────
    WarrantyStatus:
      type: string
      enum: [active, expired, void]

    Warranty:
      type: object
      required:
        [id, warranty_number, product_id, registration_id, start_date, period_months, end_date, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        warranty_number: { type: string }
        product_id: { type: string, format: uuid }
        registration_id: { type: string, format: uuid }
        start_date: { type: string, format: date }
        period_months: { type: integer }
        end_date: { type: string, format: date }
        # Computed effective status (void → expired → active), never a stored column.
        status: { $ref: "#/components/schemas/WarrantyStatus" }
        voided_at: { type: ["string", "null"], format: date-time }
        void_reason: { type: ["string", "null"] }
        voided_by: { type: ["string", "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        # Enriched (read-only) display fields joined for the UI.
        product_serial: { type: ["string", "null"] }
        customer_name: { type: ["string", "null"] }
        category_name: { type: ["string", "null"] }
        model_name: { type: ["string", "null"] }

    WarrantyListResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Warranty" }
        meta: { $ref: "#/components/schemas/MasterListMeta" }

    VoidWarrantyInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }

    # ─── Packing module (Product-Platform-driven fulfillment) ──────────────────
    PackProductsInput:
      type: object
      required: [product_ids, packing_date, packed_by]
      properties:
        product_ids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        packing_date: { type: string, format: date }
        packed_by: { type: string, minLength: 1 }

    PackProductsResult:
      type: object
      required: [packed, items]
      properties:
        packed: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }

    # ─── Dispatch module (Product-Platform-driven fulfillment) ─────────────────
    DispatchProductsInput:
      type: object
      required: [product_ids, dealer_id, dispatch_date, invoice_number]
      properties:
        product_ids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        dealer_id: { type: string, format: uuid }
        dispatch_date: { type: string, format: date }
        invoice_number: { type: string, minLength: 1 }

    DispatchProductsResult:
      type: object
      required: [dispatched, dispatch_id, dispatch_number, items]
      properties:
        dispatched: { type: integer }
        dispatch_id: { type: string, format: uuid }
        dispatch_number: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }

    ReverseDispatchInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }

    DispatchSummary:
      type: object
      required: [id, dispatch_number, invoice_number, dispatch_date, dealer_id, item_count, status, created_at]
      properties:
        id: { type: string, format: uuid }
        dispatch_number: { type: string }
        invoice_number: { type: string }
        dispatch_date: { type: string, format: date }
        dealer_id: { type: string, format: uuid }
        dealer_name: { type: ["string", "null"] }
        dispatched_by: { type: string }
        item_count: { type: integer }
        status: { type: string, enum: [dispatched, reversed] }
        reversed_at: { type: ["string", "null"], format: date-time }
        created_at: { type: string, format: date-time }

    DispatchListResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DispatchSummary" }
        meta:
          type: object
          required: [total, page, pageSize]
          properties:
            total: { type: integer }
            page: { type: integer }
            pageSize: { type: integer }

    DispatchDealerInfo:
      type: object
      properties:
        code: { type: ["string", "null"] }
        name: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        gst_number: { type: ["string", "null"] }
        contact_person: { type: ["string", "null"] }
        mobile: { type: ["string", "null"] }

    DispatchItemView:
      type: object
      required: [id, product_id, product_serial]
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        product_serial: { type: string }
        product_status: { type: ["string", "null"] }
        category_name: { type: ["string", "null"] }
        model_code: { type: ["string", "null"] }
        model_name: { type: ["string", "null"] }

    DispatchReversalInfo:
      type: object
      required: [reason, reversed_by, reversed_at]
      properties:
        reason: { type: string }
        reversed_by: { type: string }
        reversed_at: { type: string, format: date-time }

    DispatchDetail:
      type: object
      required: [id, dispatch_number, invoice_number, dispatch_date, dealer_id, item_count, status, created_at, dealer, items]
      properties:
        id: { type: string, format: uuid }
        dispatch_number: { type: string }
        invoice_number: { type: string }
        dispatch_date: { type: string, format: date }
        dealer_id: { type: string, format: uuid }
        dispatched_by: { type: string }
        item_count: { type: integer }
        status: { type: string, enum: [dispatched, reversed] }
        created_at: { type: string, format: date-time }
        dealer: { $ref: "#/components/schemas/DispatchDealerInfo" }
        reversal:
          oneOf:
            - $ref: "#/components/schemas/DispatchReversalInfo"
            - type: "null"
        items:
          type: array
          items: { $ref: "#/components/schemas/DispatchItemView" }

    # ─── Dealer module (read-only projection over the Product Platform) ─────────
    DealerSummary:
      type: object
      required: [id, dealerCode, dealerName, status]
      properties:
        id: { type: string, format: uuid }
        dealerCode: { type: string }
        dealerName: { type: string }
        status: { type: string }

    DealerInventoryResponse:
      type: object
      required: [dealer, total, items]
      properties:
        dealer: { $ref: "#/components/schemas/DealerSummary" }
        total: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }

    DealerDispatchHistoryEntry:
      type: object
      required: [event_id, product_id, official_product_serial, dispatched_at, actor]
      properties:
        event_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        official_product_serial: { type: string }
        category_name: { type: ["string", "null"] }
        model_name: { type: ["string", "null"] }
        dispatch_number: { type: ["string", "null"] }
        dispatch_date: { type: ["string", "null"] }
        invoice_number: { type: ["string", "null"] }
        dispatched_at: { type: string, format: date-time }
        actor: { type: string }

    DealerDispatchHistoryResponse:
      type: object
      required: [dealer, total, items]
      properties:
        dealer: { $ref: "#/components/schemas/DealerSummary" }
        total: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/DealerDispatchHistoryEntry" }

    # ─── Material Issue Note (MIN) ──────────────────────────────────────────────
    MinRequirementView:
      type: object
      required: [bom_line_id, material_id, uom, quantity_per, scrap_percent, required_qty, is_critical_component, traceability_required, available_qty]
      properties:
        bom_line_id: { type: string, format: uuid }
        material_id: { type: string, format: uuid }
        material_code: { type: ["string", "null"] }
        material_name: { type: ["string", "null"] }
        uom: { type: string }
        quantity_per: { type: number }
        scrap_percent: { type: number }
        required_qty: { type: number }
        is_critical_component: { type: boolean }
        traceability_required: { type: boolean }
        available_qty: { type: number }
        suggested_grn_id: { type: ["string", "null"], format: uuid }
        suggested_grn_line_id: { type: ["string", "null"], format: uuid }
        suggested_grn_number: { type: ["string", "null"] }
        suggested_supplier_lot_number: { type: ["string", "null"] }

    MinPreview:
      type: object
      required: [production_order_id, has_active_min, has_approved_bom, requirements]
      properties:
        production_order_id: { type: string, format: uuid }
        bom_header_id: { type: ["string", "null"], format: uuid }
        bom_number: { type: ["string", "null"] }
        bom_revision: { type: ["integer", "null"] }
        has_approved_bom: { type: boolean }
        has_active_min: { type: boolean }
        active_min_id: { type: ["string", "null"], format: uuid }
        active_min_number: { type: ["string", "null"] }
        requirements:
          type: array
          items: { $ref: "#/components/schemas/MinRequirementView" }

    IssueMaterialsLineInput:
      type: object
      required: [source_bom_line_id]
      properties:
        source_bom_line_id: { type: string, format: uuid }
        issued_qty: { type: number, minimum: 0 }
        grn_id: { type: ["string", "null"], format: uuid }
        grn_line_id: { type: ["string", "null"], format: uuid }
        supplier_lot_number: { type: ["string", "null"] }

    IssueMaterialsInput:
      type: object
      properties:
        notes: { type: ["string", "null"] }
        lines:
          type: array
          items: { $ref: "#/components/schemas/IssueMaterialsLineInput" }

    ReverseMinInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }

    MinLineView:
      type: object
      required: [id, line_number, material_id, source_bom_line_id, required_qty, issued_qty, uom, is_critical_component, traceability_required]
      properties:
        id: { type: string, format: uuid }
        line_number: { type: integer }
        material_id: { type: string, format: uuid }
        material_code: { type: ["string", "null"] }
        material_name: { type: ["string", "null"] }
        source_bom_line_id: { type: string, format: uuid }
        required_qty: { type: number }
        issued_qty: { type: number }
        uom: { type: string }
        grn_id: { type: ["string", "null"], format: uuid }
        grn_line_id: { type: ["string", "null"], format: uuid }
        supplier_lot_number: { type: ["string", "null"] }
        is_critical_component: { type: boolean }
        traceability_required: { type: boolean }

    MinReversalInfo:
      type: object
      required: [reason, reversed_at]
      properties:
        reason: { type: string }
        reversed_by: { type: ["string", "null"] }
        reversed_at: { type: string, format: date-time }

    MinSummary:
      type: object
      required: [id, min_number, source_type, source_ref_id, bom_revision, status, line_count, is_reversed, created_at]
      properties:
        id: { type: string, format: uuid }
        min_number: { type: string }
        source_type: { type: string }
        source_ref_id: { type: string, format: uuid }
        bom_header_id: { type: ["string", "null"], format: uuid }
        bom_number: { type: ["string", "null"] }
        bom_revision: { type: integer }
        status: { type: string }
        issued_by: { type: ["string", "null"] }
        line_count: { type: integer }
        is_reversed: { type: boolean }
        reversed_at: { type: ["string", "null"], format: date-time }
        created_at: { type: string, format: date-time }

    MinDetail:
      type: object
      required: [id, min_number, source_type, source_ref_id, bom_revision, status, line_count, is_reversed, created_at, lines]
      properties:
        id: { type: string, format: uuid }
        min_number: { type: string }
        source_type: { type: string }
        source_ref_id: { type: string, format: uuid }
        bom_header_id: { type: ["string", "null"], format: uuid }
        bom_number: { type: ["string", "null"] }
        bom_revision: { type: integer }
        status: { type: string }
        issued_by: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        line_count: { type: integer }
        is_reversed: { type: boolean }
        reversed_at: { type: ["string", "null"], format: date-time }
        created_at: { type: string, format: date-time }
        reversal:
          oneOf:
            - $ref: "#/components/schemas/MinReversalInfo"
            - type: "null"
        lines:
          type: array
          items: { $ref: "#/components/schemas/MinLineView" }

    MinListResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MinSummary" }
        meta:
          type: object
          required: [total, page, pageSize]
          properties:
            total: { type: integer }
            page: { type: integer }
            pageSize: { type: integer }

    # Product Category master (A)
    ProductCategory:
      $ref: "#/components/schemas/MasterCommon"

    ProductCategoryInput:
      $ref: "#/components/schemas/MasterCommonInput"

    ProductCategoryUpdate:
      $ref: "#/components/schemas/MasterCommonUpdate"

    # Product Workflow master (C)
    ProductWorkflow:
      allOf:
        - $ref: "#/components/schemas/MasterCommon"
        - type: object
          properties:
            stage_sequence:
              type: array
              items: { type: string }

    ProductWorkflowInput:
      allOf:
        - $ref: "#/components/schemas/MasterCommonInput"
        - type: object
          properties:
            stage_sequence:
              type: array
              items: { type: string }

    ProductWorkflowUpdate:
      allOf:
        - $ref: "#/components/schemas/MasterCommonUpdate"
        - type: object
          properties:
            stage_sequence:
              type: array
              items: { type: string }

    # ─── Inventory Platform — Generic material→component-master linkage ─────────
    # The component FAMILY a material links to. CLOSED set mirroring the DB pgEnum.
    LinkedMasterType:
      type: string
      enum: [CELL, BMS, CABLE, BUSBAR, CONNECTOR, CHARGER, CABINET]

    # What a material IS for (drives validation + the Inventory tabs).
    MaterialUsageType:
      type: string
      enum: [INVENTORY_COMPONENT, CONSUMABLE, PACKAGING, SERVICE_ITEM]

    # Resolved summary of the component master a material links to (read-only,
    # derived server-side). Null when the material links to no master.
    LinkedMasterSummary:
      type: ["object", "null"]
      required: [type, id, code, name]
      properties:
        type: { $ref: "#/components/schemas/LinkedMasterType" }
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }

    # ─── Inventory Platform — Material Category master (lookup) ─────────────────
    MaterialCategory:
      allOf:
        - $ref: "#/components/schemas/MasterCommon"
        - type: object
          properties:
            # Declared component family for INVENTORY_COMPONENT materials in this
            # category; drives the picker + validation. Null = non-component category.
            linked_master_type: { type: ["string", "null"] }
            # SOLE driver of whether materials in this category must link a component
            # (engineering) master. Admin-editable; not derived from linked_master_type.
            engineering_master_required: { type: boolean }

    MaterialCategoryInput:
      allOf:
        - $ref: "#/components/schemas/MasterCommonInput"
        - type: object
          properties:
            linked_master_type: { type: ["string", "null"] }
            engineering_master_required: { type: boolean }

    MaterialCategoryUpdate:
      allOf:
        - $ref: "#/components/schemas/MasterCommonUpdate"
        - type: object
          properties:
            linked_master_type: { type: ["string", "null"] }
            engineering_master_required: { type: boolean }

    # ─── Inventory Platform — Material Master ──────────────────────────────────
    MaterialMaster:
      allOf:
        - $ref: "#/components/schemas/MasterCommon"
        - type: object
          properties:
            category_id: { type: string, format: uuid }
            uom: { type: string, enum: [PCS, KG, M, L, SET, ROLL] }
            manufacturer: { type: ["string", "null"] }
            usage_type: { $ref: "#/components/schemas/MaterialUsageType" }
            linked_master_type: { type: ["string", "null"] }
            linked_master_id: { type: ["string", "null"], format: uuid }
            # Read-only derived summary of the linked component master.
            linked_master: { $ref: "#/components/schemas/LinkedMasterSummary" }
            cell_master_id: { type: ["string", "null"], format: uuid }

    MaterialMasterInput:
      allOf:
        - $ref: "#/components/schemas/MasterCommonInput"
        - type: object
          required: [category_id, uom]
          properties:
            category_id: { type: string, format: uuid }
            uom: { type: string, enum: [PCS, KG, M, L, SET, ROLL] }
            manufacturer: { type: ["string", "null"] }
            usage_type: { $ref: "#/components/schemas/MaterialUsageType" }
            linked_master_type: { type: ["string", "null"] }
            linked_master_id: { type: ["string", "null"], format: uuid }

    MaterialMasterUpdate:
      allOf:
        - $ref: "#/components/schemas/MasterCommonUpdate"
        - type: object
          properties:
            category_id: { type: string, format: uuid }
            uom: { type: string, enum: [PCS, KG, M, L, SET, ROLL] }
            manufacturer: { type: ["string", "null"] }
            usage_type: { $ref: "#/components/schemas/MaterialUsageType" }
            linked_master_type: { type: ["string", "null"] }
            linked_master_id: { type: ["string", "null"], format: uuid }

    # ─── Inventory Platform — Supplier Master ──────────────────────────────────
    Supplier:
      $ref: "#/components/schemas/MasterCommon"

    SupplierInput:
      $ref: "#/components/schemas/MasterCommonInput"

    SupplierUpdate:
      $ref: "#/components/schemas/MasterCommonUpdate"

    # ─── Inventory Platform — Material Workflow Master ─────────────────────────
    MaterialPostReceiptAction:
      type: string
      enum: [INCOMING_INSPECTION, DIRECT_TO_INVENTORY]

    MaterialWorkflow:
      allOf:
        - $ref: "#/components/schemas/MasterCommon"
        - type: object
          required: [post_receipt_action]
          properties:
            post_receipt_action: { $ref: "#/components/schemas/MaterialPostReceiptAction" }

    MaterialWorkflowInput:
      allOf:
        - $ref: "#/components/schemas/MasterCommonInput"
        - type: object
          required: [post_receipt_action]
          properties:
            post_receipt_action: { $ref: "#/components/schemas/MaterialPostReceiptAction" }

    MaterialWorkflowUpdate:
      allOf:
        - $ref: "#/components/schemas/MasterCommonUpdate"
        - type: object
          properties:
            post_receipt_action: { $ref: "#/components/schemas/MaterialPostReceiptAction" }

    # ─── Inventory Platform — Material Workflow Assignment ─────────────────────
    MaterialWorkflowAssignment:
      type: object
      required: [id, category_id, workflow_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        workflow_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MaterialWorkflowAssignmentUpsert:
      type: object
      required: [category_id, workflow_id]
      properties:
        category_id: { type: string, format: uuid }
        workflow_id: { type: string, format: uuid }

    # ─── Inventory Platform — GRN ──────────────────────────────────────────────
    # ─── Procurement — Purchase Orders ────────────────────────────────────────
    PurchaseOrderStatus:
      type: string
      enum: [draft, submitted, approved, partially_received, fully_received, closed, cancelled]

    PurchaseOrderLine:
      type: object
      required:
        [id, purchase_order_id, line_number, material_id, ordered_qty, received_qty, rejected_qty, cancelled_qty, open_qty, uom, created_at]
      properties:
        id: { type: string, format: uuid }
        purchase_order_id: { type: string, format: uuid }
        line_number: { type: integer }
        material_id: { type: string, format: uuid }
        material_code: { type: ["string", "null"] }
        material_name: { type: ["string", "null"] }
        ordered_qty: { type: number }
        received_qty: { type: number }
        rejected_qty: { type: number }
        cancelled_qty: { type: number }
        open_qty: { type: number }
        unit_price: { type: ["number", "null"] }
        uom: { $ref: "#/components/schemas/InventoryUom" }
        required_date: { type: ["string", "null"], format: date-time }
        notes: { type: ["string", "null"] }
        created_at: { type: string, format: date-time }

    PurchaseOrderLineInput:
      type: object
      required: [material_id, ordered_qty]
      properties:
        material_id: { type: string, format: uuid }
        ordered_qty: { type: number, exclusiveMinimum: 0 }
        unit_price: { type: ["number", "null"], minimum: 0 }
        required_date: { type: ["string", "null"], format: date-time }
        notes: { type: ["string", "null"] }

    PurchaseOrderLineUpdate:
      type: object
      properties:
        material_id: { type: string, format: uuid }
        ordered_qty: { type: number, exclusiveMinimum: 0 }
        unit_price: { type: ["number", "null"], minimum: 0 }
        required_date: { type: ["string", "null"], format: date-time }
        notes: { type: ["string", "null"] }

    PurchaseOrder:
      type: object
      required:
        [id, po_number, supplier_id, status, currency, over_receipt_tolerance_percent, created_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        po_number: { type: string }
        supplier_id: { type: string, format: uuid }
        supplier_code: { type: ["string", "null"] }
        supplier_name: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/PurchaseOrderStatus" }
        ordered_date: { type: ["string", "null"], format: date-time }
        required_date: { type: ["string", "null"], format: date-time }
        approved_by: { type: ["string", "null"], format: uuid }
        approved_at: { type: ["string", "null"], format: date-time }
        currency: { type: string }
        total_amount: { type: ["number", "null"] }
        terms: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        over_receipt_tolerance_percent: { type: number }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PurchaseOrderDetail:
      allOf:
        - $ref: "#/components/schemas/PurchaseOrder"
        - type: object
          required: [lines]
          properties:
            lines:
              type: array
              items: { $ref: "#/components/schemas/PurchaseOrderLine" }

    PurchaseOrderInput:
      type: object
      required: [supplier_id, lines]
      properties:
        supplier_id: { type: string, format: uuid }
        ordered_date: { type: ["string", "null"], format: date-time }
        required_date: { type: ["string", "null"], format: date-time }
        currency: { type: string, minLength: 3, maxLength: 3, default: INR }
        terms: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        over_receipt_tolerance_percent: { type: number, minimum: 0, maximum: 100, default: 5 }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PurchaseOrderLineInput" }

    PurchaseOrderUpdate:
      type: object
      properties:
        supplier_id: { type: string, format: uuid }
        ordered_date: { type: ["string", "null"], format: date-time }
        required_date: { type: ["string", "null"], format: date-time }
        currency: { type: string, minLength: 3, maxLength: 3 }
        terms: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        over_receipt_tolerance_percent: { type: number, minimum: 0, maximum: 100 }

    PurchaseOrderCancelInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }

    GrnStatus:
      type: string
      enum: [draft, posted]

    GrnInspectionStatus:
      type: ["string", "null"]
      enum: [pending, passed, rejected, partial, null]

    InventoryUom:
      type: string
      enum: [PCS, KG, M, L, SET, ROLL]

    GrnLineItem:
      type: object
      required:
        [id, grn_id, line_number, material_id, quantity_received, uom, created_at]
      properties:
        id: { type: string, format: uuid }
        grn_id: { type: string, format: uuid }
        line_number: { type: integer }
        material_id: { type: string, format: uuid }
        purchase_order_line_id: { type: ["string", "null"], format: uuid }
        # Derived read-only provenance joined from the Material Master (never stored on
        # the line). Lets the GRN view show what the material is and how it is routed.
        material_name: { type: ["string", "null"] }
        material_code: { type: ["string", "null"] }
        usage_type: { type: ["string", "null"] }
        linked_master: { $ref: "#/components/schemas/LinkedMasterSummary" }
        quantity_received: { type: number }
        uom: { $ref: "#/components/schemas/InventoryUom" }
        supplier_lot_number: { type: ["string", "null"] }
        inspection_status: { $ref: "#/components/schemas/GrnInspectionStatus" }
        remarks: { type: ["string", "null"] }
        created_at: { type: string, format: date-time }

    GrnLineItemInput:
      type: object
      required: [material_id, quantity_received]
      properties:
        material_id: { type: string, format: uuid }
        purchase_order_line_id: { type: ["string", "null"], format: uuid }
        quantity_received: { type: number, exclusiveMinimum: 0 }
        supplier_lot_number: { type: ["string", "null"] }
        remarks: { type: ["string", "null"] }

    Grn:
      type: object
      required:
        [id, grn_number, supplier_id, received_date, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        grn_number: { type: string }
        supplier_id: { type: string, format: uuid }
        purchase_order_id: { type: ["string", "null"], format: uuid }
        received_date: { type: string }
        invoice_number: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/GrnStatus" }
        remarks: { type: ["string", "null"] }
        posted_at: { type: ["string", "null"], format: date-time }
        posted_by: { type: ["string", "null"], format: uuid }
        created_by: { type: ["string", "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_by: { type: ["string", "null"], format: uuid }
        updated_at: { type: string, format: date-time }

    GrnDetail:
      allOf:
        - $ref: "#/components/schemas/Grn"
        - type: object
          required: [lines]
          properties:
            lines:
              type: array
              items: { $ref: "#/components/schemas/GrnLineItem" }

    GrnInput:
      type: object
      required: [supplier_id, received_date, lines]
      properties:
        supplier_id: { type: string, format: uuid }
        purchase_order_id: { type: ["string", "null"], format: uuid }
        received_date: { type: string }
        invoice_number: { type: ["string", "null"] }
        remarks: { type: ["string", "null"] }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/GrnLineItemInput" }

    # ─── Inventory Platform — Cell Stock & Material Transfer ───────────────────
    CellStockLine:
      type: object
      required: [grn_line_id, grn_id, grn_number, material_id, material_code, material_name, supplier_id, supplier_name, uom, received_date, available_qty, is_mapped]
      properties:
        grn_line_id: { type: string, format: uuid }
        grn_id: { type: string, format: uuid }
        grn_number: { type: string }
        material_id: { type: string, format: uuid }
        material_code: { type: string }
        material_name: { type: string }
        supplier_id: { type: string, format: uuid }
        supplier_name: { type: string }
        manufacturer: { type: ["string", "null"] }
        invoice_number: { type: ["string", "null"] }
        supplier_lot_number: { type: ["string", "null"] }
        uom: { $ref: "#/components/schemas/InventoryUom" }
        received_date: { type: string }
        available_qty: { type: number }
        is_mapped:
          type: boolean
          description: True when the material has a cell-master mapping (D3); a transfer requires this
        cell_master_id: { type: ["string", "null"], format: uuid }
        cell_model: { type: ["string", "null"] }
        cell_chemistry: { type: ["string", "null"] }
        nominal_capacity_ah: { type: ["number", "null"] }
        nominal_voltage_v: { type: ["number", "null"] }

    MaterialTransfer:
      type: object
      required: [id, transfer_number, from_location, to_location, material_id, grn_id, grn_line_id, supplier_id, quantity, uom, created_at]
      properties:
        id: { type: string, format: uuid }
        transfer_number: { type: string }
        from_location: { type: string }
        to_location: { type: string }
        material_id: { type: string, format: uuid }
        material_code: { type: ["string", "null"] }
        material_name: { type: ["string", "null"] }
        grn_id: { type: string, format: uuid }
        grn_number: { type: ["string", "null"] }
        grn_line_id: { type: string, format: uuid }
        supplier_id: { type: string, format: uuid }
        supplier_name: { type: ["string", "null"] }
        invoice_number: { type: ["string", "null"] }
        supplier_lot_number: { type: ["string", "null"] }
        quantity: { type: number }
        uom: { $ref: "#/components/schemas/InventoryUom" }
        transferred_by: { type: ["string", "null"], format: uuid }
        operator_name: { type: ["string", "null"] }
        created_at: { type: string, format: date-time }
        cell_lot_id: { type: ["string", "null"], format: uuid }
        lot_number: { type: ["string", "null"] }

    MaterialTransferConsumer:
      type: object
      required: [production_order_id, cells_consumed]
      properties:
        production_order_id: { type: string, format: uuid }
        order_number: { type: ["string", "null"] }
        battery_number: { type: ["string", "null"] }
        status: { type: ["string", "null"] }
        cells_consumed: { type: integer }

    MaterialTransferDetail:
      allOf:
        - $ref: "#/components/schemas/MaterialTransfer"
        - type: object
          properties:
            remarks: { type: ["string", "null"] }
            cell_lot: { $ref: "#/components/schemas/CellLot" }
            destination_audit:
              $ref: "#/components/schemas/MaterialTransferDestinationAudit"
            consumed_by:
              type: array
              items: { $ref: "#/components/schemas/MaterialTransferConsumer" }

    MaterialTransferDestinationAudit:
      type: object
      description: Cross-domain reconciliation for the Store ledger movement and Cell Processing destination.
      required:
        [source_movement_qty, source_available_qty, destination_quantity, generated_cell_count, reconciliation_status]
      properties:
        source_movement_qty:
          type: number
          description: Signed available-ledger movement for this transfer; normally negative.
        source_available_qty:
          type: number
          description: Remaining available quantity on the original GRN line after this transfer.
        destination_quantity:
          type: ["number", "null"]
          description: Cell-lot quantity represented in the Cell Processing domain.
        generated_cell_count:
          type: integer
          description: Number of generated cell records linked to the destination lot.
        reconciliation_status:
          type: string
          enum: [reconciled, mismatch, missing_destination]

    MaterialTransferInput:
      type: object
      required: [grn_line_id, quantity]
      properties:
        grn_line_id: { type: string, format: uuid }
        quantity: { type: number, exclusiveMinimum: 0 }
        received_by: { type: ["string", "null"] }
        remarks: { type: ["string", "null"] }

    InventoryTransaction:
      type: object
      required:
        [id, transaction_type, material_id, quantity, uom, stock_state, source_document_type, source_document_id, source_line_id, created_at]
      properties:
        id: { type: string, format: uuid }
        transaction_type:
          type: string
          enum: [GRN_RECEIPT, INSPECTION_RELEASE, INSPECTION_ACCEPT, INSPECTION_REJECT]
        material_id: { type: string, format: uuid }
        quantity: { type: number }
        uom: { $ref: "#/components/schemas/InventoryUom" }
        stock_state: { type: string, enum: [inspection_pending, available, rejected] }
        source_document_type: { type: string }
        source_document_id: { type: string, format: uuid }
        source_line_id: { type: string, format: uuid }
        created_by: { type: ["string", "null"], format: uuid }
        created_at: { type: string, format: date-time }

    IncomingInspectionResult:
      type: string
      enum: [passed, rejected, partial]

    IncomingInspection:
      type: object
      required: [id, inspection_number, grn_id, created_at]
      properties:
        id: { type: string, format: uuid }
        inspection_number: { type: string }
        grn_id: { type: string, format: uuid }
        grn_number: { type: ["string", "null"] }
        remarks: { type: ["string", "null"] }
        inspected_by: { type: ["string", "null"], format: uuid }
        created_at: { type: string, format: date-time }

    IncomingInspectionLine:
      type: object
      required:
        [id, inspection_id, grn_line_id, grn_id, material_id, quantity_received, accepted_qty, rejected_qty, result, created_at]
      properties:
        id: { type: string, format: uuid }
        inspection_id: { type: string, format: uuid }
        grn_line_id: { type: string, format: uuid }
        grn_id: { type: string, format: uuid }
        material_id: { type: string, format: uuid }
        quantity_received: { type: number }
        accepted_qty: { type: number }
        rejected_qty: { type: number }
        result: { $ref: "#/components/schemas/IncomingInspectionResult" }
        rejection_reason: { type: ["string", "null"] }
        created_at: { type: string, format: date-time }

    IncomingInspectionDetail:
      allOf:
        - $ref: "#/components/schemas/IncomingInspection"
        - type: object
          required: [lines]
          properties:
            lines:
              type: array
              items: { $ref: "#/components/schemas/IncomingInspectionLine" }

    IncomingInspectionLineInput:
      type: object
      required: [grn_line_id, accepted_qty, rejected_qty]
      properties:
        grn_line_id: { type: string, format: uuid }
        accepted_qty: { type: number, minimum: 0 }
        rejected_qty: { type: number, minimum: 0 }
        rejection_reason: { type: ["string", "null"] }

    IncomingInspectionInput:
      type: object
      required: [grn_id, lines]
      properties:
        grn_id: { type: string, format: uuid }
        remarks: { type: ["string", "null"] }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/IncomingInspectionLineInput" }

    EligibleGrn:
      type: object
      required: [grn_id, grn_number, supplier_id, received_date, pending_line_count]
      properties:
        grn_id: { type: string, format: uuid }
        grn_number: { type: string }
        supplier_id: { type: string, format: uuid }
        received_date: { type: string }
        pending_line_count: { type: integer }

    StockBalance:
      type: object
      required: [material_id, material_code, material_name, uom, stock_state, quantity]
      properties:
        material_id: { type: string, format: uuid }
        material_code: { type: string }
        material_name: { type: string }
        # Derived provenance (read-only) — the material self-describes so the unified
        # inventory row shows usage + linked component master without a ledger change.
        usage_type: { $ref: "#/components/schemas/MaterialUsageType" }
        linked_master: { $ref: "#/components/schemas/LinkedMasterSummary" }
        uom: { $ref: "#/components/schemas/InventoryUom" }
        stock_state: { type: string, enum: [inspection_pending, available, rejected] }
        quantity: { type: number }

    # ─── Per-material provenance drill-down (read-only) ─────────────────────────
    # One row per contributing GRN receipt line for a material. Derived entirely from
    # the signed inventory ledger + existing GRN/Inspection records — NO denormalization
    # onto stock rows, NO new tables, NO change to inventory calculations.
    MaterialProvenanceReceipt:
      type: object
      required: [grn_id, grn_number, supplier_id, supplier_name, received_date, grn_line_id, received_qty, remaining_available_qty, uom, warehouse_location]
      properties:
        grn_id: { type: string, format: uuid }
        grn_number: { type: string }
        supplier_id: { type: string, format: uuid }
        supplier_name: { type: string }
        received_date: { type: string }
        grn_line_id: { type: string, format: uuid }
        received_qty: { type: number }
        uom: { $ref: "#/components/schemas/InventoryUom" }
        inspection_id: { type: ["string", "null"], format: uuid }
        inspection_number: { type: ["string", "null"] }
        inspection_status:
          type: ["string", "null"]
          description: The GRN line's inspection badge (pending/passed/rejected/partial); null for direct-to-inventory lines
        accepted_qty: { type: ["number", "null"] }
        rejected_qty: { type: ["number", "null"] }
        remaining_available_qty:
          type: number
          description: Ledger-derived — SUM of available signed txns for this GRN line (receipts + inspection accepts − transfers)
        inspector_id: { type: ["string", "null"], format: uuid }
        inspector_name: { type: ["string", "null"] }
        warehouse_location:
          type: ["string", "null"]
          description: Future-ready placeholder — no warehouse-location model exists yet (always null in v1.0)

    MaterialProvenance:
      type: object
      required: [material_id, material_code, material_name, receipts]
      properties:
        material_id: { type: string, format: uuid }
        material_code: { type: string }
        material_name: { type: string }
        usage_type: { $ref: "#/components/schemas/MaterialUsageType" }
        linked_master: { $ref: "#/components/schemas/LinkedMasterSummary" }
        receipts:
          type: array
          items: { $ref: "#/components/schemas/MaterialProvenanceReceipt" }

  # ── Manufacturing — Production Orders ───────────────────────────────────────
  /manufacturing/orders:
    get:
      operationId: listProductionOrders
      tags: [manufacturing]
      summary: List production orders
      parameters:
        - $ref: "#/components/parameters/SearchParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, released, in_progress, completed, cancelled]
        - name: priority
          in: query
          required: false
          schema:
            type: string
            enum: [low, medium, high]
      responses:
        "200":
          description: List of production orders
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProductionOrder"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
    post:
      operationId: createProductionOrder
      tags: [manufacturing]
      summary: Create production order (auto-generates battery number + 8 stages)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionOrderInput"
      responses:
        "201":
          description: Created order with stages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionOrderDetail"

  /manufacturing/orders/{id}:
    get:
      operationId: getProductionOrder
      tags: [manufacturing]
      summary: Get production order with stages, timeline, and genealogy
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Production order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionOrderDetail"
        "404":
          description: Not found
    patch:
      operationId: updateProductionOrder
      tags: [manufacturing]
      summary: Update production order header fields
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionOrderUpdate"
      responses:
        "200":
          description: Updated production order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionOrderDetail"

  # ── Manufacturing — Stages ────────────────────────────────────────────────
  /manufacturing/orders/{id}/stages:
    get:
      operationId: listOrderStages
      tags: [manufacturing]
      summary: List all 8 stages for a production order
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: All stages
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrderStage"

  /manufacturing/orders/{id}/stages/{stage}:
    get:
      operationId: getOrderStage
      tags: [manufacturing]
      summary: Get a specific stage
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/StageParam"
      responses:
        "200":
          description: Stage detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStage"
    patch:
      operationId: updateOrderStage
      tags: [manufacturing]
      summary: Save stage form data (notes, stageData) without transitioning status
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/StageParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageUpdate"
      responses:
        "200":
          description: Updated stage

              schema:
                $ref: "#/components/schemas/Cell"
        "400":
          description: Cell not in gradeable state

  /cells/{id}/correct:
    post:
      operationId: correctCell
      tags: [cells]
      summary: Correct a graded cell's measurements (controlled re-grade)
      description: >
        DEF-CW02-006 controlled correction workflow. Supervisor/Director only.
        Re-measures an already-graded cell with a mandatory correction reason.
        The original measurement is preserved immutably; the correction is appended
        as a new measurement record and becomes the active grade. Emits an audit
        event (cell_grade_corrected) on the lot timeline.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CellCorrectionInput"
      responses:
        "200":
          description: Corrected cell (active snapshot)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cell"
        "400":
          description: Cell not in a correctable state, or invalid input
        "403":
          description: Insufficient role (supervisor/director only)
        "404":
          description: Cell not found

  /cells/{id}/measurements:
    get:
      operationId: listCellMeasurements
      tags: [cells]
      summary: Full measurement history for a cell (genealogy)
      description: >
        Returns every measurement record for the cell ordered by sequence — the
        original grading plus any corrections — so the grading genealogy is always
        reconstructable. The highest-sequence record is the active measurement.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Measurement history (oldest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CellMeasurement"
        "404":
          description: Cell not found


      responses:
        "200":
          description: Single product master
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductMaster"
    patch:
      operationId: updateProductMaster
      tags: [masters]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductMasterUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductMaster"

  /masters/products/{id}/status:
    patch:
      operationId: toggleProductMasterStatus
      tags: [masters]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:

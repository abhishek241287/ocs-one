        supplierLotNumber: { type: ["string", "null"] }
        dateReceived: { type: string }
        quantityReceived: { type: integer, minimum: 1 }
        receivedBy: { type: string }
        remarks: { type: ["string", "null"] }
        cellMasterId: { type: ["string", "null"], format: uuid }
        reason:
          type: string
          minLength: 1
          description: "Mandatory justification for a Historical Import / Emergency Recovery manual lot — recorded to the audit trail"

